# مدرسهٔ هدایت — کلاس زنده (BigBlueButton داکری) پشت nginx خود سرور
#
# BigBlueButton با github.com/bigbluebutton/docker روی همین سرور اجرا می‌شود و در setup به
# «Should an automatic HTTPS Proxy be included?» پاسخ n داده شده؛ پس خودش روی 127.0.0.1:48087 گوش می‌دهد
# و این فایل https و دامنه را برایش فراهم می‌کند. صدا و تصویر از nginx نمی‌گذرد: UDP 16384-32768 باید باز باشد.
#
# نصب:
#   ۱. «live.madresehedayat.ir» را اگر لازم است عوض کنید
#   ۲. cp deploy/nginx/live.conf /etc/nginx/sites-available/live.conf
#      ln -s /etc/nginx/sites-available/live.conf /etc/nginx/sites-enabled/
#   ۳. certbot certonly --nginx -d live.madresehedayat.ir
#   ۴. nginx -t && systemctl reload nginx

server {
  listen 80;
  # listen [::]:80;          # اگر سرور IPv6 دارد باز کنید
  server_name live.madresehedayat.ir;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  # listen [::]:443 ssl http2;   # اگر سرور IPv6 دارد باز کنید
  server_name live.madresehedayat.ir;

  ssl_certificate     /etc/letsencrypt/live/live.madresehedayat.ir/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/live.madresehedayat.ir/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # بارگذاری اسلاید در کلاس
  client_max_body_size 100m;

  access_log /var/log/nginx/bigbluebutton.access.log;
  error_log  /var/log/nginx/bigbluebutton.error.log;

  location / {
    proxy_pass http://127.0.0.1:48087;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # کلاینت کلاس روی websocket کار می‌کند
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_read_timeout 6h;
    proxy_send_timeout 6h;
  }
}
