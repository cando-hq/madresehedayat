# مدرسهٔ هدایت — پیکربندی nginx خود سرور (بدون کانتینر وب)
#
# nginx سرور دو کار می‌کند:
#   ۱. فایل‌های ساخته‌شدهٔ وب را از /var/www/madrese می‌دهد (با ./deploy/build-web.sh ساخته و کپی می‌شوند)
#   ۲. هر درخواست /api/ را به کانتینر api روی 127.0.0.1:3000 می‌فرستد (API_PORT در .env)
#
# نصب:
#   ۱. همهٔ «madresehedayat.ir»ها را با دامنهٔ خودتان عوض کنید
#   ۲. cp deploy/nginx/madrese.conf /etc/nginx/sites-available/madrese.conf
#      ln -s /etc/nginx/sites-available/madrese.conf /etc/nginx/sites-enabled/
#      (یا اگر sites-enabled ندارید: cp به /etc/nginx/conf.d/madrese.conf)
#   ۳. اگر هنوز گواهی ندارید: certbot certonly --nginx -d madresehedayat.ir
#   ۴. nginx -t && systemctl reload nginx
#
# اگر API_PORT را در .env عوض کردید، پورت upstream پایین را هم عوض کنید.

upstream madrese_api {
  server 127.0.0.1:3000;
  keepalive 16;
}

# http ← https
server {
  listen 80;
  # listen [::]:80;          # اگر سرور IPv6 دارد باز کنید
  server_name madresehedayat.ir;

  # برای تمدید گواهی certbot با روش webroot (اگر از --nginx استفاده می‌کنید هم بی‌ضرر است)
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  # listen [::]:443 ssl http2;   # اگر سرور IPv6 دارد باز کنید
  server_name madresehedayat.ir;

  ssl_certificate     /etc/letsencrypt/live/madresehedayat.ir/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/madresehedayat.ir/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:madrese_ssl:10m;

  root /var/www/madrese;
  index index.html;

  # بارگذاری ویدیو و فایل درس تا ۵۰۰ مگابایت
  client_max_body_size 520m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API و فایل‌ها
  location /api/ {
    proxy_pass http://madrese_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # بارگذاری بزرگ مستقیم به API برود، نه اول روی دیسک nginx
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # فایل‌های ساخته‌شده با نام هش‌دار: کش بلندمدت
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # برنامهٔ تک‌صفحه‌ای: همهٔ مسیرها به index.html
  # X-Frame-Options عمداً نیست: برنامهٔ ایتا مدرسه را در قاب (iframe) باز می‌کند
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri $uri/ /index.html;
  }
}
