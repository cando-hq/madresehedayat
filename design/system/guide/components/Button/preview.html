<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>Button</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400..800&display=swap"><style></style></head><body>

<div class="mh-row">
<button class="btn btn-primary">ادامهٔ یادگیری <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></button>
<button class="btn btn-secondary">صفحهٔ دوره</button>
<button class="btn btn-ghost">انصراف</button>
<button class="btn btn-danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l.8 12.5h9.4L17.5 7"/></svg> حذف دوره</button>
</div>
<div class="mh-row" style="padding-top:0">
<button class="btn btn-primary btn-lg">دریافت کد</button>
<button class="btn btn-secondary btn-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> دورهٔ تازه</button>
<button class="btn btn-secondary btn-icon" aria-label="افزودن"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
<button class="btn btn-primary" disabled>در حال ارسال…</button>
