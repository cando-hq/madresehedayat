<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>Card</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400..800&display=swap"><style></style></head><body>

<style>.g{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:var(--space-4);padding:var(--space-6)}</style>
<div class="g">
<article class="card" style="padding:var(--space-6);display:grid;gap:var(--space-4);align-content:start">
<span class="hint">ادامهٔ یادگیری</span>
<h3 style="font-size:18px;font-weight:800">همراهی نوجوانان در مسجد</h3>
<div class="bar"><span style="width:42%"></span></div>
<div style="display:flex;justify-content:space-between;align-items:center"><span class="hint tnum">۳ از ۷ درس</span><button class="btn btn-primary btn-sm">ادامه <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></button></div>
</article>
<article class="card stat"><span class="n tnum">۸</span><span class="l">کنشگر فعال این هفته</span></article>
<article class="card stat"><span class="n tnum">٪۷۲</span><span class="l">پیشرفت پویش جاری</span></article>
</div>
</body></html>
