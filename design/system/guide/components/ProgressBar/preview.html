<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>ProgressBar</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400..800&display=swap"><style></style></head><body>

<div class="mh-stack" style="max-width:480px">
<div style="display:grid;gap:var(--space-2)"><div style="display:flex;justify-content:space-between" class="hint"><b style="color:var(--ink);font-weight:700">نماز جماعت صبح</b><span class="tnum">٪۷۲</span></div><div class="bar"><span style="width:72%"></span></div></div>
<div style="display:grid;gap:var(--space-2)"><div style="display:flex;justify-content:space-between" class="hint"><b style="color:var(--ink);font-weight:700">مسجد، خانهٔ نوجوان</b><span class="tnum">٪۱۰</span></div><div class="bar"><span style="width:10%"></span></div></div>
</div>
</body></html>
